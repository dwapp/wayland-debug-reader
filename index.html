<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayland Debug Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header>
  <h1>⚡ Wayland Debug Reader</h1>
  <span class="header-meta" id="file-label" data-i18n="fileLabel">No file loaded</span>
  <div class="header-spacer"></div>
  <span class="stat-badge"><span class="dot dot-event"></span><span id="stat-events">0</span> <span data-i18n="statEvents">events</span></span>
  <span class="stat-badge"><span class="dot dot-request"></span><span id="stat-requests">0</span> <span data-i18n="statRequests">requests</span></span>
  <span class="stat-badge"><span class="dot dot-comment"></span><span id="stat-comments">0</span> <span data-i18n="statComments">comments</span></span>
  <button class="btn" onclick="resetApp()" style="margin-left:8px" data-i18n="resetBtn">🔄 Reload</button>
  <button class="btn" id="theme-toggle" style="margin-left:4px;display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:5px 10px;" data-i18n-title="themeTitle" title="Toggle theme">🌙</button>
  <button class="btn" id="lang-toggle" style="margin-left:4px;font-weight:600;font-size:12px;padding:5px 10px;" data-i18n-title="langTitle" title="Toggle language">EN</button>
  <a href="https://github.com/dwapp/wayland-debug-reader" target="_blank" rel="noopener" class="btn" style="margin-left:4px;display:inline-flex;align-items:center;gap:5px;text-decoration:none">
    <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    GitHub
  </a>
</header>


<!-- FILTERS -->
<div class="filters" id="filters-bar">
  <div style="display:flex; align-items:center; gap:5px;">
    <input type="search" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search interface, method, argument…" />
    <select id="search-mode" class="btn" style="padding: 2px 6px; height: 26px; border-radius:var(--radius); font-size:12px; background:var(--bg3); color:var(--text); border:1px solid var(--border); outline:none;">
      <option value="search" selected data-i18n="searchOption">Search</option>
      <option value="filter" data-i18n="filterOption">Filter</option>
    </select>
    <button class="btn search-nav hidden" id="search-prev" style="padding: 0 8px;" data-i18n-title="prevTitle" title="Previous (Shift+Enter)">▲</button>
    <button class="btn search-nav hidden" id="search-next" style="padding: 0 8px;" data-i18n-title="nextTitle" title="Next (Enter)">▼</button>
    <span id="search-count" class="search-nav hidden" style="color:var(--text-dim); min-width:30px;">0/0</span>
  </div>
  <label class="toggle-label"><input type="checkbox" id="show-events" checked /> <span data-i18n="showEvents">events</span></label>
  <label class="toggle-label"><input type="checkbox" id="show-requests" checked /> <span data-i18n="showRequests">requests</span></label>
  <label class="toggle-label"><input type="checkbox" id="show-comments" checked /> <span data-i18n="showComments">comments</span></label>
  <label class="toggle-label"><input type="checkbox" id="show-time-diff" /> <span data-i18n="timeDiff">Relative time</span></label>
  <label class="toggle-label"><input type="checkbox" id="highlight-only" /> <span data-i18n="highlightOnly">Highlight only</span></label>
</div>

<!-- MAIN -->
<div class="main">
  <!-- DROP / LOAD OVERLAY -->
  <div id="drop-zone">
    <div class="drop-icon">🌊</div>
    <div class="drop-title">Wayland Debug Reader</div>
    <div class="drop-sub" data-i18n="dropSub">Drop a log file here, or choose a file / paste text</div>
    <div class="drop-actions">
      <button class="btn primary" onclick="document.getElementById('file-input').click()" data-i18n="chooseFile">📂 Choose file</button>
      <input type="file" id="file-input" accept=".log,.txt,*" />
    </div>
    <textarea id="paste-area" class="paste-area" data-i18n-placeholder="pasteArea" placeholder="Or paste log content here…"></textarea>
    <button class="btn primary" id="paste-load-btn" onclick="loadFromPaste()" data-i18n="loadLog">▶ Load log</button>
  </div>
  <!-- LEFT SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section" id="objects-section" style="flex:1;overflow-y:auto">
      <div class="sidebar-title">All Objects</div>
      <div id="objects-list"><div class="empty-msg" data-i18n="noObjects">No data</div></div>
    </div>
    <div class="sidebar-section" id="globals-section" style="max-height:35%;overflow-y:auto">
      <div class="sidebar-title">Globals</div>
      <div id="globals-list"></div>
    </div>
  </div>

  <!-- RESIZE HANDLE -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- LOG PANEL -->
  <div class="log-panel" id="log-panel">
    <div class="empty-msg" data-i18n="emptyLog">Load a log file to start</div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="protocols/all-protocols.js"></script>
<script src="protocol-data.js"></script>
<script src="wayland-debug-tools.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
let appState = null;        // parsed wayland state
let highlightedUniqueIds = new Set(); // currently highlighted object uniqueIds
let currentSearchMatches = [];
let currentSearchIndex = 0;

// ─── Color hash (replaces Qt.hsla) ───────────────────────────────────────────
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return h >>> 0;
}
function colorForUniqueId(uid) {
  const hue = (hashStr(String(uid)) % 360 + 360) % 360;
  return `hsl(${hue}, var(--obj-sat, 70%), var(--obj-lit, 62%))`;
}

// ─── Render helpers ──────────────────────────────────────────────────────────
function makeObjTag(obj) {
  if (!obj) return '<span class="arg-unk">?</span>';
  const uid  = obj.uniqueId || 0;
  const color = uid ? colorForUniqueId(uid) : '#888';
  const hl   = uid && highlightedUniqueIds.has(uid) ? ' highlighted-tag' : '';
  const label = `${obj.interfaceName}@${obj.id}`;
  return `<span class="obj-tag${hl}" style="color:${color}" data-uid="${uid}" title="${label}">${label}</span>`;
}

function renderArg(arg, argName) {
  const namePrefix = argName ? `<span class="arg-name">${escHtml(argName)}:</span> ` : '';
  switch (arg.type) {
    case 'object':  return `${namePrefix}${makeObjTag(arg)}`;
    case 'new':     return `${namePrefix}<span class="arg-new">new</span> ${makeObjTag(arg.object)}`;
    case 'integer': return `${namePrefix}<span class="arg-int">${arg.rawText}</span>`;
    case 'string':  return `${namePrefix}<span class="arg-str">${escHtml(arg.rawText)}</span>`;
    default:        return `${namePrefix}<span class="arg-unk">${escHtml(arg.rawText)}</span>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Render log panel ─────────────────────────────────────────────────────────
function renderLog() {
  if (!appState) return;

  const query   = document.getElementById('search-input').value.toLowerCase();
  const searchMode = document.getElementById('search-mode').value;
  const showEv  = document.getElementById('show-events').checked;
  const showReq = document.getElementById('show-requests').checked;
  const showCom = document.getElementById('show-comments').checked;
  const hlOnly  = document.getElementById('highlight-only').checked;
  const showTimeDiff = document.getElementById('show-time-diff').checked;

  let firstTimestamp = null;
  if (showTimeDiff) {
    for (const line of appState.parsedLines) {
      if (line.timestamp !== undefined && !isNaN(line.timestamp)) {
        firstTimestamp = line.timestamp;
        break;
      }
    }
  }

  const frag = document.createDocumentFragment();
  let countEv = 0, countReq = 0, countCom = 0;
  currentSearchMatches = [];

  for (const line of appState.parsedLines) {
    const { type, parts, rawText } = line;

    // type filter
    if (type === 'event'   && !showEv)  continue;
    if (type === 'request' && !showReq) continue;
    if (type === 'comment' && !showCom) continue;

    // highlight-only filter
    if (hlOnly && highlightedUniqueIds.size > 0) {
      if (type === 'event' || type === 'request') {
        const obj = parts.object;
        const inObj = obj && highlightedUniqueIds.has(obj.uniqueId);
        const inArgs = parts.args && parts.args.some(a =>
          (a.type === 'object' && highlightedUniqueIds.has(a.uniqueId)) ||
          (a.type === 'new'    && a.object && highlightedUniqueIds.has(a.object.uniqueId))
        );
        if (!inObj && !inArgs) continue;
      }
    }

    // search filter
    let isSearchMatch = false;
    if (query) {
      if (rawText.toLowerCase().includes(query)) {
        isSearchMatch = true;
      } else if (searchMode === 'filter') {
        continue;
      }
    }

    // count
    if (type === 'event')   countEv++;
    else if (type === 'request') countReq++;
    else countCom++;

    const div = document.createElement('div');
    div.className = 'log-line ' + type;

    if (isSearchMatch && searchMode === 'search') {
      div.classList.add('search-match');
      currentSearchMatches.push(div);
    }

    // highlight line if object matches
    if (highlightedUniqueIds.size > 0 && (type === 'event' || type === 'request')) {
      const obj = parts.object;
      const touched = (obj && highlightedUniqueIds.has(obj.uniqueId)) ||
        (parts.args && parts.args.some(a =>
          (a.type === 'object' && highlightedUniqueIds.has(a.uniqueId)) ||
          (a.type === 'new'    && a.object && highlightedUniqueIds.has(a.object.uniqueId))
        ));
      if (touched) div.classList.add('highlighted-line');
    }

    if (type === 'comment') {
      div.innerHTML = escHtml(rawText);
    } else {
      let timeHtml = '';
      if (line.timestampStr) {
        let tsText = line.timestampStr;
        if (showTimeDiff && firstTimestamp !== null && line.timestamp !== undefined && !isNaN(line.timestamp)) {
          let diff = line.timestamp - firstTimestamp;
          tsText = '+' + diff.toFixed(3);
        }
        timeHtml = `<span class="timestamp">[${tsText}]</span> `;
      }
      const discardedHtml = line.discarded ? '<span class="discarded-tag">discarded</span> ' : '';
      const arrow = type === 'request' ? '<span class="arrow">→</span>' : '';
      // Look up protocol arg names for this interface.method
      const argNames = getArgNames(parts.object.interfaceName, parts.fn);
      const argsHtml = parts.args.map((a, i) => {
        const name = (argNames && i < argNames.length) ? argNames[i] : null;
        return renderArg(a, name);
      }).join('<span class="arg-sep">, </span>');
      div.innerHTML = `${timeHtml}${discardedHtml}${arrow}${makeObjTag(parts.object)}<span class="fn-name">.${escHtml(parts.fn)}</span><span class="paren">(</span>${argsHtml}<span class="paren">)</span>`;
    }

    frag.appendChild(div);
  }

  const panel = document.getElementById('log-panel');
  panel.innerHTML = '';
  if (frag.childElementCount === 0) {
    panel.innerHTML = `<div class="empty-msg">${t('noMatchLog')}</div>`;
  } else {
    panel.appendChild(frag);
  }

  // update stats
  document.getElementById('stat-events').textContent   = countEv;
  document.getElementById('stat-requests').textContent = countReq;
  document.getElementById('stat-comments').textContent = countCom;

  if (searchMode === 'search') {
    currentSearchIndex = 0;
    updateSearchNav();
  }

  const isSearchActive = searchMode === 'search' && query.length > 0;
  document.querySelectorAll('.search-nav').forEach(el => el.classList.toggle('hidden', !isSearchActive));

  // attach click handlers to obj-tags inside log
  panel.querySelectorAll('.obj-tag[data-uid]').forEach(tag => {
    tag.addEventListener('click', () => {
      const uid = parseInt(tag.dataset.uid);
      if (uid) selectObject(uid);
    });
  });
}

// ─── Render sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  if (!appState) return;

  // Objects
  const objList = document.getElementById('objects-list');
  objList.innerHTML = '';
  for (const uid in appState.objects) {
    const obj = appState.objects[uid];
    const color = colorForUniqueId(obj.uniqueId);
    const hl = highlightedUniqueIds.has(obj.uniqueId) ? ' highlighted' : '';
    const chip = document.createElement('span');
    chip.className = `obj-chip${hl}`;
    chip.style.color = color;
    chip.dataset.uid = obj.uniqueId;
    chip.textContent = `${obj.interfaceName}@${obj.id}`;
    chip.title = chip.textContent;
    chip.addEventListener('click', () => selectObject(obj.uniqueId));
    objList.appendChild(chip);
  }

  // Globals
  const glList = document.getElementById('globals-list');
  glList.innerHTML = '';
  for (const k in appState.globals) {
    const g = appState.globals[k];
    const el = document.createElement('div');
    el.className = 'global-item';
    el.innerHTML = `${g.number}: <span>${escHtml(g.interfaceName)}</span> v${g.version}`;
    glList.appendChild(el);
  }
}

// ─── Object selection ─────────────────────────────────────────────────────────
function selectObject(uid) {
  if (highlightedUniqueIds.has(uid)) {
    highlightedUniqueIds.delete(uid);
  } else {
    highlightedUniqueIds.add(uid);
  }
  renderSidebar();
  renderLog();
}

// ─── Load log text ────────────────────────────────────────────────────────────
function loadLog(text, label) {
  // reset nextId counter in parser
  nextId = 1;
  appState = parseLog(text);

  document.getElementById('file-label').textContent = label;
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('filters-bar').classList.add('visible');
  highlightedUniqueIds.clear();

  renderSidebar();
  renderLog();
}

function resetApp() {
  appState = null;
  highlightedUniqueIds.clear();
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('filters-bar').classList.remove('visible');
  document.getElementById('log-panel').innerHTML = `<div class="empty-msg">${t('emptyLog')}</div>`;
  document.getElementById('objects-list').innerHTML = `<div class="empty-msg">${t('noObjects')}</div>`;
  document.getElementById('globals-list').innerHTML = '';
  document.getElementById('file-label').textContent = t('fileLabel');
  ['stat-events','stat-requests','stat-comments'].forEach(id => document.getElementById(id).textContent = '0');
}

// ─── File input ───────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadLog(ev.target.result, file.name);
  reader.readAsText(file);
});

// ─── Drag & drop ──────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropZone.classList.remove('dragging'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadLog(ev.target.result, file.name);
  reader.readAsText(file);
});

// ─── Paste area ───────────────────────────────────────────────────────────────
function loadFromPaste() {
  const text = document.getElementById('paste-area').value.trim();
  if (text) loadLog(text, t('pastedContent'));
}
document.getElementById('paste-area').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) loadFromPaste();
});

// ─── Filter controls ──────────────────────────────────────────────────────────
['show-events','show-requests','show-comments','show-time-diff','highlight-only'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderLog);
});
let searchTimer;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderLog, 180);
});

function updateSearchNav() {
  const countEl = document.getElementById('search-count');
  if (!currentSearchMatches.length) {
    countEl.textContent = '0/0';
    return;
  }
  countEl.textContent = `${currentSearchIndex + 1}/${currentSearchMatches.length}`;
  currentSearchMatches.forEach(el => el.classList.remove('search-active'));
  const activeEl = currentSearchMatches[currentSearchIndex];
  activeEl.classList.add('search-active');
  activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

document.getElementById('search-prev').addEventListener('click', () => {
  if (!currentSearchMatches.length) return;
  currentSearchIndex = (currentSearchIndex - 1 + currentSearchMatches.length) % currentSearchMatches.length;
  updateSearchNav();
});

document.getElementById('search-next').addEventListener('click', () => {
  if (!currentSearchMatches.length) return;
  currentSearchIndex = (currentSearchIndex + 1) % currentSearchMatches.length;
  updateSearchNav();
});

document.getElementById('search-mode').addEventListener('change', () => {
  renderLog();
});
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('search-mode').value === 'search') {
    e.preventDefault();
    if (e.shiftKey) {
      document.getElementById('search-prev').click();
    } else {
      document.getElementById('search-next').click();
    }
  }
});

// ─── Sidebar resize ───────────────────────────────────────────────────────────
const handle = document.getElementById('resize-handle');
const sidebar = document.getElementById('sidebar');
let resizing = false, startX = 0, startW = 0;
handle.addEventListener('mousedown', e => {
  resizing = true; startX = e.clientX; startW = sidebar.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!resizing) return;
  const w = Math.max(140, Math.min(800, startW + e.clientX - startX));
  sidebar.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  resizing = false;
  handle.classList.remove('dragging');
  document.body.style.userSelect = '';
});
// ─── Theme toggle ─────────────────────────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
})();

function updateThemeIcon(theme) {
  document.getElementById('theme-toggle').textContent = theme === 'dark' ? '🌙' : '☀️';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
});

// Protocol data is loaded synchronously via <script src="protocols/all-protocols.js">

// ─── i18n init & lang toggle ─────────────────────────────────────────────────
applyI18n();

document.getElementById('lang-toggle').addEventListener('click', () => {
  setLanguage(currentLang === 'zh' ? 'en' : 'zh');
});
</script>
</body>
</html>
