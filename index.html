<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayland Debug Reader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f18;
      --bg2:       #13162a;
      --bg3:       #1c2040;
      --border:    #2a2f52;
      --text:      #c8cee8;
      --text-dim:  #5a6080;
      --text-muted:#3a4060;
      --accent:    #5b8ef0;
      --accent2:   #7c5bf0;
      --event:     #1a2b4a;
      --request:   #1a3a2a;
      --comment:   #1e1e28;
      --highlight: rgba(250,200,30,0.18);
      --highlight-border: #f0b020;
      --radius:    6px;
      --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
      --font-ui:   'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-meta {
      font-size: 12px;
      color: var(--text-dim);
    }
    .header-spacer { flex: 1; }
    .btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--border); border-color: var(--accent); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    .btn.primary:hover { opacity: .85; }

    /* ── FILTERS BAR ── */
    .filters {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .filters.visible { display: flex; }
    .filters input[type=search] {
      flex: 1;
      max-width: 320px;
      padding: 5px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color .15s;
    }
    .filters input[type=search]:focus { border-color: var(--accent); }
    .search-match { box-shadow: inset 3px 0 0 rgba(255, 255, 255, 0.3) !important; }
    .search-active {
      background: rgba(255, 255, 255, 0.15) !important;
      outline: 2px solid #fff !important;
      outline-offset: -2px;
      position: relative;
      z-index: 1;
    }
    .search-nav.hidden { display: none !important; }
    .search-nav {
      height: 26px; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { accent-color: var(--accent); cursor: pointer; }

    /* ── MAIN LAYOUT ── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── DROP OVERLAY ── */
    .main { position: relative; }
    #drop-zone {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(13,15,24,.96);
      backdrop-filter: blur(4px);
    }
    #drop-zone.hidden { display: none; }
    #drop-zone.dragging { background: rgba(91,142,240,.08); }
    .drop-icon {
      font-size: 56px;
      filter: drop-shadow(0 0 20px var(--accent));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .drop-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .drop-sub {
      font-size: 13px;
      color: var(--text-dim);
    }
    .drop-actions { display: flex; gap: 10px; margin-top: 10px; }
    #file-input { display: none; }
    .paste-area {
      width: 480px;
      height: 140px;
      resize: none;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 10px;
      outline: none;
    }
    .paste-area:focus { border-color: var(--accent); }

    /* ── LEFT SIDEBAR ── */
    .sidebar {
      width: 340px;
      min-width: 180px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg2);
    }
    .sidebar-section { overflow-y: auto; padding: 10px 0; }
    .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }
    .sidebar-title {
      padding: 4px 12px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .obj-chip {
      display: block;
      padding: 3px 12px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      border-radius: 0;
      border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .obj-chip:hover { background: var(--bg3); }
    .obj-chip.highlighted {
      background: var(--highlight);
      border-left-color: var(--highlight-border);
    }
    .global-item {
      padding: 2px 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      white-space: nowrap;
    }
    .global-item span { color: var(--text); }

    /* ── RESIZE HANDLE ── */
    .resize-handle {
      width: 4px;
      cursor: col-resize;
      background: var(--border);
      flex-shrink: 0;
      transition: background .15s;
    }
    .resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

    /* ── LOG PANEL ── */
    .log-panel {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 6px 0;
    }
    .log-panel::-webkit-scrollbar { width: 6px; height: 6px; }
    .log-panel::-webkit-scrollbar-track { background: transparent; }
    .log-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .log-line {
      display: flex;
      align-items: baseline;
      min-height: 24px;
      padding: 2px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-left: 3px solid transparent;
      transition: background .08s;
      white-space: nowrap;
    }
    .log-line:hover { background: rgba(255,255,255,.04); }
    .log-line.event   { background: var(--event);   border-left-color: #2a6fcf; }
    .log-line.request { background: var(--request);  border-left-color: #2aaf6f; }
    .log-line.comment { background: var(--comment);  color: var(--text-muted); }
    .log-line.highlighted-line { background: var(--highlight) !important; border-left-color: var(--highlight-border) !important; }

    .log-line .timestamp { color: var(--text-dim); margin-right: 6px; user-select: none; }
    .log-line .arrow   { color: #2aaf6f; margin-right: 6px; }
    .log-line .fn-name { color: #9de0e8; }
    .log-line .paren   { color: var(--text-dim); }
    .log-line .arg-sep { color: var(--text-dim); margin: 0 2px; }

    .obj-tag {
      display: inline-block;
      padding: 0 5px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255,255,255,.07);
      cursor: pointer;
      border: 1px solid transparent;
      transition: filter .1s, border-color .1s;
    }
    .obj-tag:hover { filter: brightness(1.3); border-color: currentColor; }
    .obj-tag.highlighted-tag {
      outline: 2px solid var(--highlight-border);
      background: rgba(240,176,32,.15);
    }

    .arg-new   { color: #c0a0f0; }
    .arg-int   { color: #f0c060; }
    .arg-str   { color: #a0d880; }
    .arg-unk   { color: var(--text-dim); }

    /* ── STATS ── */
    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: var(--bg3);
      color: var(--text-dim);
    }
    .stat-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-event   { background: #2a6fcf; }
    .dot-request { background: #2aaf6f; }
    .dot-comment { background: var(--text-muted); }

    /* ── EMPTY / LOADING ── */
    .empty-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 13px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>⚡ Wayland Debug Reader</h1>
  <span class="header-meta" id="file-label">未加载</span>
  <div class="header-spacer"></div>
  <span class="stat-badge"><span class="dot dot-event"></span><span id="stat-events">0</span> events</span>
  <span class="stat-badge"><span class="dot dot-request"></span><span id="stat-requests">0</span> requests</span>
  <span class="stat-badge"><span class="dot dot-comment"></span><span id="stat-comments">0</span> comments</span>
  <button class="btn" onclick="resetApp()" style="margin-left:8px">🔄 重新加载</button>
  <a href="https://github.com/dwapp/wayland-debug-reader" target="_blank" rel="noopener" class="btn" style="margin-left:4px;display:inline-flex;align-items:center;gap:5px;text-decoration:none">
    <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    GitHub
  </a>
</header>


<!-- FILTERS -->
<div class="filters" id="filters-bar">
  <div style="display:flex; align-items:center; gap:5px;">
    <input type="search" id="search-input" placeholder="搜索接口名、方法名、参数…" />
    <select id="search-mode" class="btn" style="padding: 2px 6px; height: 26px; border-radius:var(--radius); font-size:12px; background:var(--bg3); color:var(--text); border:1px solid var(--border); outline:none;">
      <option value="search" selected>搜索</option>
      <option value="filter">过滤</option>
    </select>
    <button class="btn search-nav hidden" id="search-prev" style="padding: 0 8px;" title="上一个 (Shift+Enter)">▲</button>
    <button class="btn search-nav hidden" id="search-next" style="padding: 0 8px;" title="下一个 (Enter)">▼</button>
    <span id="search-count" class="search-nav hidden" style="color:var(--text-dim); min-width:30px;">0/0</span>
  </div>
  <label class="toggle-label"><input type="checkbox" id="show-events" checked /> events</label>
  <label class="toggle-label"><input type="checkbox" id="show-requests" checked /> requests</label>
  <label class="toggle-label"><input type="checkbox" id="show-comments" checked /> comments</label>
  <label class="toggle-label"><input type="checkbox" id="show-time" checked /> 时间</label>
  <label class="toggle-label" id="label-time-diff"><input type="checkbox" id="show-time-diff" /> 相对时间</label>
  <label class="toggle-label"><input type="checkbox" id="highlight-only" /> 仅高亮对象</label>
</div>

<!-- MAIN -->
<div class="main">
  <!-- DROP / LOAD OVERLAY -->
  <div id="drop-zone">
    <div class="drop-icon">🌊</div>
    <div class="drop-title">Wayland Debug Reader</div>
    <div class="drop-sub">拖拽日志文件到此处，或选择文件 / 粘贴文本</div>
    <div class="drop-actions">
      <button class="btn primary" onclick="document.getElementById('file-input').click()">📂 选择文件</button>
      <input type="file" id="file-input" accept=".log,.txt,*" />
    </div>
    <textarea id="paste-area" class="paste-area" placeholder="或者直接粘贴日志内容到这里…"></textarea>
    <button class="btn primary" id="paste-load-btn" onclick="loadFromPaste()">▶ 加载日志</button>
  </div>
  <!-- LEFT SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section" id="objects-section" style="flex:1;overflow-y:auto">
      <div class="sidebar-title">All Objects</div>
      <div id="objects-list"><div class="empty-msg">暂无数据</div></div>
    </div>
    <div class="sidebar-section" id="globals-section" style="max-height:35%;overflow-y:auto">
      <div class="sidebar-title">Globals</div>
      <div id="globals-list"></div>
    </div>
  </div>

  <!-- RESIZE HANDLE -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- LOG PANEL -->
  <div class="log-panel" id="log-panel">
    <div class="empty-msg">请先加载日志文件</div>
  </div>
</div>

<script src="wayland-debug-tools.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
let appState = null;        // parsed wayland state
let highlightedUniqueIds = new Set(); // currently highlighted object uniqueIds
let currentSearchMatches = [];
let currentSearchIndex = 0;

// ─── Color hash (replaces Qt.hsla) ───────────────────────────────────────────
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return h >>> 0;
}
function colorForUniqueId(uid) {
  const hue = (hashStr(String(uid)) % 360 + 360) % 360;
  return `hsl(${hue},70%,62%)`;
}

// ─── Render helpers ──────────────────────────────────────────────────────────
function makeObjTag(obj) {
  if (!obj) return '<span class="arg-unk">?</span>';
  const uid  = obj.uniqueId || 0;
  const color = uid ? colorForUniqueId(uid) : '#888';
  const hl   = uid && highlightedUniqueIds.has(uid) ? ' highlighted-tag' : '';
  const label = `${obj.interfaceName}@${obj.id}`;
  return `<span class="obj-tag${hl}" style="color:${color}" data-uid="${uid}" title="${label}">${label}</span>`;
}

function renderArg(arg) {
  switch (arg.type) {
    case 'object':  return makeObjTag(arg);
    case 'new':     return `<span class="arg-new">new</span> ${makeObjTag(arg.object)}`;
    case 'integer': return `<span class="arg-int">${arg.rawText}</span>`;
    case 'string':  return `<span class="arg-str">${escHtml(arg.rawText)}</span>`;
    default:        return `<span class="arg-unk">${escHtml(arg.rawText)}</span>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Render log panel ─────────────────────────────────────────────────────────
function renderLog() {
  if (!appState) return;

  const query   = document.getElementById('search-input').value.toLowerCase();
  const searchMode = document.getElementById('search-mode').value;
  const showEv  = document.getElementById('show-events').checked;
  const showReq = document.getElementById('show-requests').checked;
  const showCom = document.getElementById('show-comments').checked;
  const hlOnly  = document.getElementById('highlight-only').checked;
  const showTime = document.getElementById('show-time').checked;
  const showTimeDiff = document.getElementById('show-time-diff').checked;

  document.getElementById('label-time-diff').style.display = showTime ? 'flex' : 'none';

  let firstTimestamp = null;
  if (showTime && showTimeDiff) {
    for (const line of appState.parsedLines) {
      if (line.timestamp !== undefined && !isNaN(line.timestamp)) {
        firstTimestamp = line.timestamp;
        break;
      }
    }
  }

  const frag = document.createDocumentFragment();
  let countEv = 0, countReq = 0, countCom = 0;
  currentSearchMatches = [];

  for (const line of appState.parsedLines) {
    const { type, parts, rawText } = line;

    // type filter
    if (type === 'event'   && !showEv)  continue;
    if (type === 'request' && !showReq) continue;
    if (type === 'comment' && !showCom) continue;

    // highlight-only filter
    if (hlOnly && highlightedUniqueIds.size > 0) {
      if (type === 'event' || type === 'request') {
        const obj = parts.object;
        const inObj = obj && highlightedUniqueIds.has(obj.uniqueId);
        const inArgs = parts.args && parts.args.some(a =>
          (a.type === 'object' && highlightedUniqueIds.has(a.uniqueId)) ||
          (a.type === 'new'    && a.object && highlightedUniqueIds.has(a.object.uniqueId))
        );
        if (!inObj && !inArgs) continue;
      }
    }

    // search filter
    let isSearchMatch = false;
    if (query) {
      if (rawText.toLowerCase().includes(query)) {
        isSearchMatch = true;
      } else if (searchMode === 'filter') {
        continue;
      }
    }

    // count
    if (type === 'event')   countEv++;
    else if (type === 'request') countReq++;
    else countCom++;

    const div = document.createElement('div');
    div.className = 'log-line ' + type;

    if (isSearchMatch && searchMode === 'search') {
      div.classList.add('search-match');
      currentSearchMatches.push(div);
    }

    // highlight line if object matches
    if (highlightedUniqueIds.size > 0 && (type === 'event' || type === 'request')) {
      const obj = parts.object;
      const touched = (obj && highlightedUniqueIds.has(obj.uniqueId)) ||
        (parts.args && parts.args.some(a =>
          (a.type === 'object' && highlightedUniqueIds.has(a.uniqueId)) ||
          (a.type === 'new'    && a.object && highlightedUniqueIds.has(a.object.uniqueId))
        ));
      if (touched) div.classList.add('highlighted-line');
    }

    if (type === 'comment') {
      div.innerHTML = escHtml(rawText);
    } else {
      let timeHtml = '';
      if (showTime && line.timestampStr) {
        let tsText = line.timestampStr;
        if (showTimeDiff && firstTimestamp !== null && line.timestamp !== undefined && !isNaN(line.timestamp)) {
          let diff = line.timestamp - firstTimestamp;
          tsText = '+' + diff.toFixed(3);
        }
        timeHtml = `<span class="timestamp">[${tsText}]</span> `;
      }
      const arrow = type === 'request' ? '<span class="arrow">→</span>' : '';
      const argsHtml = parts.args.map(renderArg).join('<span class="arg-sep">, </span>');
      div.innerHTML = `${timeHtml}${arrow}${makeObjTag(parts.object)}<span class="fn-name">.${escHtml(parts.fn)}</span><span class="paren">(</span>${argsHtml}<span class="paren">)</span>`;
    }

    frag.appendChild(div);
  }

  const panel = document.getElementById('log-panel');
  panel.innerHTML = '';
  if (frag.childElementCount === 0) {
    panel.innerHTML = '<div class="empty-msg">没有匹配的日志行</div>';
  } else {
    panel.appendChild(frag);
  }

  // update stats
  document.getElementById('stat-events').textContent   = countEv;
  document.getElementById('stat-requests').textContent = countReq;
  document.getElementById('stat-comments').textContent = countCom;

  if (searchMode === 'search') {
    currentSearchIndex = 0;
    updateSearchNav();
  }

  const isSearchActive = searchMode === 'search' && query.length > 0;
  document.querySelectorAll('.search-nav').forEach(el => el.classList.toggle('hidden', !isSearchActive));

  // attach click handlers to obj-tags inside log
  panel.querySelectorAll('.obj-tag[data-uid]').forEach(tag => {
    tag.addEventListener('click', () => {
      const uid = parseInt(tag.dataset.uid);
      if (uid) selectObject(uid);
    });
  });
}

// ─── Render sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  if (!appState) return;

  // Objects
  const objList = document.getElementById('objects-list');
  objList.innerHTML = '';
  for (const uid in appState.objects) {
    const obj = appState.objects[uid];
    const color = colorForUniqueId(obj.uniqueId);
    const hl = highlightedUniqueIds.has(obj.uniqueId) ? ' highlighted' : '';
    const chip = document.createElement('span');
    chip.className = `obj-chip${hl}`;
    chip.style.color = color;
    chip.dataset.uid = obj.uniqueId;
    chip.textContent = `${obj.interfaceName}@${obj.id}`;
    chip.title = chip.textContent;
    chip.addEventListener('click', () => selectObject(obj.uniqueId));
    objList.appendChild(chip);
  }

  // Globals
  const glList = document.getElementById('globals-list');
  glList.innerHTML = '';
  for (const k in appState.globals) {
    const g = appState.globals[k];
    const el = document.createElement('div');
    el.className = 'global-item';
    el.innerHTML = `${g.number}: <span>${escHtml(g.interfaceName)}</span> v${g.version}`;
    glList.appendChild(el);
  }
}

// ─── Object selection ─────────────────────────────────────────────────────────
function selectObject(uid) {
  if (highlightedUniqueIds.has(uid)) {
    highlightedUniqueIds.delete(uid);
  } else {
    highlightedUniqueIds.add(uid);
  }
  renderSidebar();
  renderLog();
}

// ─── Load log text ────────────────────────────────────────────────────────────
function loadLog(text, label) {
  // reset nextId counter in parser
  nextId = 1;
  appState = parseLog(text);

  document.getElementById('file-label').textContent = label;
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('filters-bar').classList.add('visible');
  highlightedUniqueIds.clear();

  renderSidebar();
  renderLog();
}

function resetApp() {
  appState = null;
  highlightedUniqueIds.clear();
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('filters-bar').classList.remove('visible');
  document.getElementById('log-panel').innerHTML = '<div class="empty-msg">请先加载日志文件</div>';
  document.getElementById('objects-list').innerHTML = '<div class="empty-msg">暂无数据</div>';
  document.getElementById('globals-list').innerHTML = '';
  document.getElementById('file-label').textContent = '未加载';
  ['stat-events','stat-requests','stat-comments'].forEach(id => document.getElementById(id).textContent = '0');
}

// ─── File input ───────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadLog(ev.target.result, file.name);
  reader.readAsText(file);
});

// ─── Drag & drop ──────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropZone.classList.remove('dragging'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadLog(ev.target.result, file.name);
  reader.readAsText(file);
});

// ─── Paste area ───────────────────────────────────────────────────────────────
function loadFromPaste() {
  const text = document.getElementById('paste-area').value.trim();
  if (text) loadLog(text, '(粘贴内容)');
}
document.getElementById('paste-area').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) loadFromPaste();
});

// ─── Filter controls ──────────────────────────────────────────────────────────
['show-events','show-requests','show-comments','show-time','show-time-diff','highlight-only'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderLog);
});
let searchTimer;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderLog, 180);
});

function updateSearchNav() {
  const countEl = document.getElementById('search-count');
  if (!currentSearchMatches.length) {
    countEl.textContent = '0/0';
    return;
  }
  countEl.textContent = `${currentSearchIndex + 1}/${currentSearchMatches.length}`;
  currentSearchMatches.forEach(el => el.classList.remove('search-active'));
  const activeEl = currentSearchMatches[currentSearchIndex];
  activeEl.classList.add('search-active');
  activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

document.getElementById('search-prev').addEventListener('click', () => {
  if (!currentSearchMatches.length) return;
  currentSearchIndex = (currentSearchIndex - 1 + currentSearchMatches.length) % currentSearchMatches.length;
  updateSearchNav();
});

document.getElementById('search-next').addEventListener('click', () => {
  if (!currentSearchMatches.length) return;
  currentSearchIndex = (currentSearchIndex + 1) % currentSearchMatches.length;
  updateSearchNav();
});

document.getElementById('search-mode').addEventListener('change', () => {
  renderLog();
});
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('search-mode').value === 'search') {
    e.preventDefault();
    if (e.shiftKey) {
      document.getElementById('search-prev').click();
    } else {
      document.getElementById('search-next').click();
    }
  }
});

// ─── Sidebar resize ───────────────────────────────────────────────────────────
const handle = document.getElementById('resize-handle');
const sidebar = document.getElementById('sidebar');
let resizing = false, startX = 0, startW = 0;
handle.addEventListener('mousedown', e => {
  resizing = true; startX = e.clientX; startW = sidebar.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!resizing) return;
  const w = Math.max(140, Math.min(800, startW + e.clientX - startX));
  sidebar.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  resizing = false;
  handle.classList.remove('dragging');
  document.body.style.userSelect = '';
});
</script>
</body>
</html>
